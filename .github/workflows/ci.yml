name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebiosrm
          POSTGRES_PASSWORD: ebiosrm_dev
          POSTGRES_DB: ebiosrm_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ebiosrm -d ebiosrm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restaurer les dependances
        run: dotnet restore EbiosRM.sln

      - name: Compiler
        run: dotnet build EbiosRM.sln --no-restore --configuration Release

      - name: Installer dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # La base "ebiosrm_test" (service Postgres ci-dessus) doit avoir le meme
      # schema que la base de dev -- EbiosApiFactory.cs (tests d'integration)
      # pointe dessus directement, aucune migration automatique au demarrage.
      - name: Appliquer les migrations sur la base de test
        run: >
          dotnet ef database update
          --project src/EbiosRM.Api/EbiosRM.Api.csproj
          --connection "Host=localhost;Port=5433;Database=ebiosrm_test;Username=ebiosrm;Password=ebiosrm_dev"

      - name: Tests
        run: dotnet test EbiosRM.sln --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Tests
        run: npx vitest run

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # Rejoue le parcours complet des 5 ateliers via de vraies interactions
    # navigateur (script du skill test-etude-complete-playwright), jusque-la
    # relance seulement a la main. dotnet test / vitest ne couvrent pas ce
    # niveau -- une regression comme les telechargements de rapport casses
    # par le chantier d'auth (jamais remontee par les tests unitaires) ne
    # serait detectee que si quelqu'un pense a relancer le script localement.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebiosrm
          POSTGRES_PASSWORD: ebiosrm_dev
          POSTGRES_DB: ebiosrm
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ebiosrm -d ebiosrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Compiler le backend
        run: dotnet build EbiosRM.sln --configuration Release

      - name: Installer dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # appsettings.Development.json est dans .gitignore (contient un secret,
      # meme si c'est un secret factice de dev) -- absent du checkout CI, donc
      # ConnectionStrings:EbiosDb et Jwt:Secret sont fournis ici par variables
      # d'environnement plutot que de dependre de ce fichier.
      - name: Appliquer les migrations
        run: >
          dotnet ef database update
          --project src/EbiosRM.Api/EbiosRM.Api.csproj
          --connection "Host=localhost;Port=5433;Database=ebiosrm;Username=ebiosrm;Password=ebiosrm_dev"

      - name: Demarrer le backend en arriere-plan
        working-directory: src/EbiosRM.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__EbiosDb: "Host=localhost;Port=5433;Database=ebiosrm;Username=ebiosrm;Password=ebiosrm_dev"
          Jwt__Secret: "ci-e2e-secret-facultatif-non-reutilise-en-production-0123456789"
        run: |
          dotnet bin/Release/net8.0/EbiosRM.Api.dll --urls http://localhost:5197 > /tmp/backend.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5197/api/v1/health | grep -q '"database":"connected"'; then
              echo "Backend pret."
              exit 0
            fi
            sleep 1
          done
          echo "Backend jamais devenu pret -- log :"
          cat /tmp/backend.log
          exit 1

      - name: Installer les dependances frontend
        working-directory: frontend
        run: npm ci

      # Le serveur de dev Vite (pas le build de prod) -- c'est celui contre
      # lequel le script du skill a toujours ete ecrit et verifie.
      - name: Demarrer le frontend en arriere-plan
        working-directory: frontend
        run: |
          npm run dev -- --port 5174 > /tmp/frontend.log 2>&1 &
          disown
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5174/ -o /dev/null; then
              echo "Frontend pret."
              exit 0
            fi
            sleep 1
          done
          echo "Frontend jamais devenu pret -- log :"
          cat /tmp/frontend.log
          exit 1

      - name: Installer Playwright
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      - name: Rejouer le parcours complet des 5 ateliers
        run: node .claude/skills/test-etude-complete-playwright/etude-complete.mjs "CI E2E ${{ github.run_id }}"

      - name: Logs backend/frontend (en cas d'echec)
        if: failure()
        run: |
          echo "--- backend ---"; cat /tmp/backend.log || true
          echo "--- frontend ---"; cat /tmp/frontend.log || true

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    # Le frontend (Vercel) se redeploie automatiquement sur chaque push --
    # le backend (Render, service Docker/GHCR) ne le faisait pas, un simple
    # `git push` ne suffisait donc jamais a mettre l'API en ligne a jour
    # (constate en conditions reelles : plusieurs chantiers de cette session
    # invisibles en production malgre des push verts). Ce job ferme l'ecart :
    # reconstruit l'image seulement si backend/frontend/e2e sont tous verts,
    # la pousse sur GHCR, puis declenche le redeploiement Render via son
    # Deploy Hook.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Applique les migrations en attente a la base de production AVANT de
      # deployer le nouveau code -- sans cette etape, un commit qui change le
      # schema (ex. AjoutProprietaireEtude) casse la prod des que le nouveau
      # code tourne contre l'ancien schema (deja arrive : 500 sur /etudes
      # jusqu'a une migration manuelle en urgence). PROD_DB_CONNECTION_STRING
      # est la chaine Npgsql telle qu'affichee dans Render -> Environment ->
      # ConnectionStrings__EbiosDb.
      - name: Appliquer les migrations en production
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.10
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet ef database update --project src/EbiosRM.Api/EbiosRM.Api.csproj --connection "${{ secrets.PROD_DB_CONNECTION_STRING }}"

      - name: Connexion a GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construire l'image Docker
        run: docker build -t ghcr.io/joinito18/ebiosrm-api:latest -f src/EbiosRM.Api/Dockerfile src/EbiosRM.Api

      - name: Pousser l'image sur GHCR
        run: docker push ghcr.io/joinito18/ebiosrm-api:latest

      - name: Declencher le redeploiement Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
