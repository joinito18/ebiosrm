name: Release application de bureau

# Sur un tag "v*" (ex. v1.0.0) : construit l'application de bureau pour
# Windows / Linux / macOS, fabrique l'installeur Windows, et attache le tout
# a une Release GitHub.
#
# Declenchement manuel possible (workflow_dispatch) pour tester la chaine.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.0.0) pour un run manuel"
        required: false
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Version
        id: v
        shell: bash
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: Build (win-x64)
        run: ./build/build-desktop.ps1 -Rid win-x64
      - name: Installeur Inno Setup
        shell: pwsh
        env:
          EBIOSRM_VERSION: ${{ steps.v.outputs.value }}
        run: |
          choco install innosetup --no-progress -y
          & "$Env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\ebiosrm.iss
      - name: Zip portable
        shell: pwsh
        run: Compress-Archive -Path build\output\win-x64\* -DestinationPath EbiosRM-${{ steps.v.outputs.value }}-windows-portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            installer/output/EbiosRM-Setup.exe
            EbiosRM-*-windows-portable.zip

  unix:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, label: linux }
          - { os: macos-latest, rid: osx-arm64, label: macos-arm64 }
          - { os: macos-13, rid: osx-x64, label: macos-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build (${{ matrix.rid }})
        run: ./build/build-desktop.sh ${{ matrix.rid }}
      - name: Version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          echo "value=$V" >> "$GITHUB_OUTPUT"
      - name: Archive
        run: tar -C build/output/${{ matrix.rid }} -czf EbiosRM-${{ steps.v.outputs.value }}-${{ matrix.label }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: EbiosRM-*-${{ matrix.label }}.tar.gz

  release:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts
      - name: Créer la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $(find artefacts -type f | tr '\n' ' ')
