server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression des assets texte.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Requetes API -> conteneur backend (nom de service docker-compose "api").
    # Pas de slash final sur proxy_pass : l'URI complet ("/api/v1/...") est
    # transmis tel quel.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache long pour les assets fingerprintes par Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue retombe sur index.html (routage cote client).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
