# Développement : ne démarre que PostgreSQL. L'API et le frontend tournent
# sur la machine hôte (dotnet run / npm run dev).
#
#   docker compose up -d
#
# Pour une installation complète en conteneurs (frontend + backend + base),
# voir docker-compose.selfhost.yml et le README.

services:
  postgres:
    image: postgres:16
    container_name: ebiosrm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ebiosrm
      POSTGRES_USER: ebiosrm
      POSTGRES_PASSWORD: ebiosrm_dev
    ports:
      - "5433:5432"
    volumes:
      - ebiosrm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ebiosrm -d ebiosrm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ebiosrm_postgres_data:
