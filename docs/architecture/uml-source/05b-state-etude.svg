4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="170.9028" x="134" y="125.2104">Statut global de l'&#233;tude, d&#233;riv&#233;</text><text fill="#1B3B4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="153.8765" x="134" y="138.0151">de l'&#233;tat de ses 5 ateliers &#8212;</text><text fill="#1B3B4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="178.9326" x="134" y="150.8198">pas un champ saisi s&#233;par&#233;ment.</text><text fill="#1B3B4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="196.3027" x="134" y="163.6245">La m&#233;thode est it&#233;rative : ce retour</text><text fill="#1B3B4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="184.2446" x="134" y="176.4292">n'est pas une correction d'erreur,</text><text fill="#1B3B4F" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="185.9258" x="134" y="189.2339">c'est un nouveau cycle d'analyse.</text></g><!--link *start* to Brouillon--><g id="link_*start*_Brouillon"><path d="M424.5,26.31 C424.5,47.12 424.5,91.94 424.5,122.36 " fill="none" id="*start*-to-Brouillon" style="stroke:#2C5875;stroke-width:1.1;"/><polygon fill="#2C5875" points="424.5,128.36,428.5,119.36,424.5,123.36,420.5,119.36,424.5,128.36" style="stroke:#2C5875;stroke-width:1.1;"/><text fill="#4A5568" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="189.4395" x="428.5" y="71.1387">Creer(nom, perimetre, mission)</text></g><!--link Brouillon to EnCours--><g id="link_Brouillon_EnCours"><path d="M419.88,178.98 C413.72,206.05 400.56,249.7 375.5,279 C361.66,295.19 347.0566,305.0467 329.2566,313.9467 " fill="none" id="Brouillon-to-EnCours" style="stroke:#2C5875;stroke-width:1.1;"/><polygon fill="#2C5875" points="323.89,316.63,333.7287,316.1828,328.3621,314.3939,330.151,309.0274,323.89,316.63" style="stroke:#2C5875;stroke-width:1.1;"/><text fill="#4A5568" font-family="sans-se